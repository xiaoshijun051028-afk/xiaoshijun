name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.7.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (LFS + submodules)
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Cache Godot binary + import cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot
            .godot/
          key: godot-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot') }}

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import assets (MUST precede tests)
        run: godot --headless --import --quit-after 200

      - name: Run gdUnit4 tests
        run: godot --headless -s addons/gdUnit4/bin/GdUnitCmdTool.gd -- --ignoreHeadlessMode -a tests/ --report-dir logs/

      - name: Static lint gate (gdlint)
        run: |
          pip install gdtoolkit
          gdlint game/src game/autoload

      - name: Custom lints (hex literals / magic numbers)
        run: |
          godot --headless -s game/tools/lint/lint_hex_literals.gd
          godot --headless -s game/tools/lint/lint_magic_numbers.gd

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-report
          path: logs/

  nightly-level-scan:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * *'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - run: godot --headless --import --quit-after 200
      - run: godot --headless -s game/tools/level_scan.gd
